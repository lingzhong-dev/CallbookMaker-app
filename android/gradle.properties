org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Opt out of AGP 9 newDsl/builtInKotlin for third-party Flutter plugin compatibility
android.newDsl=false
android.builtInKotlin=false
# These APKs are sideloaded from GitHub, not served as multi-APKs by Google Play.
# Keep arm64 and universal on the same versionCode so switching APKs is not a downgrade.
force-version-code-ignoring-abi=true
