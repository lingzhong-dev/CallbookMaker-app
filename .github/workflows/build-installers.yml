name: Build Android & Windows Installers

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Accept Android SDK licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Resolve version
        id: meta
        run: |
          PUB_VER=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "version=${PUB_VER:-1.0.0}" >> "$GITHUB_OUTPUT"

      - run: flutter pub get

      - name: Build universal APK
        run: |
          flutter build apk --release
          mkdir -p dist/android
          cp build/app/outputs/flutter-apk/app-release.apk "dist/android/CallbookMaker-v${{ steps.meta.outputs.version }}-android-universal.apk"

      - name: Build arm64-v8a split APK
        run: |
          flutter build apk --release --split-per-abi
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/android/CallbookMaker-v${{ steps.meta.outputs.version }}-android-arm64-v8a.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: CallbookMaker-Android-APK
          path: dist/android/*.apk

  build-windows:
    name: Build Windows Setup & Portable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve version
        id: meta
        shell: pwsh
        run: |
          $line = (Get-Content pubspec.yaml | Where-Object { $_ -match '^version:' } | Select-Object -First 1)
          $ver = ($line -replace '^version:\s*', '').Split('+')[0].Trim()
          if (-not $ver) { $ver = '1.0.0' }
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - run: flutter pub get
      - run: flutter build windows --release

      - name: Package Portable ZIP and Setup EXE
        shell: pwsh
        run: |
          $ver = "${{ steps.meta.outputs.version }}"
          $releaseDir = @('build\windows\x64\runner\Release', 'build\windows\runner\Release') |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1
          if (-not $releaseDir) { throw 'Windows release build output directory not found' }
          $releaseAbs = (Resolve-Path $releaseDir).Path
          New-Item -ItemType Directory -Force -Path 'dist\windows' | Out-Null
          Compress-Archive -Path "$releaseAbs\*" -DestinationPath "dist\windows\CallbookMaker-v$ver-windows-x64-portable.zip" -Force

          $isccCandidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw 'Inno Setup ISCC.exe not found' }
          & $iscc "/DMyAppVersion=$ver" "/DReleaseDir=$releaseAbs" "windows\installer\CallbookMaker.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: CallbookMaker-Windows-Installer
          path: |
            dist/windows/*.exe
            dist/windows/*.zip

  release:
    name: Publish GitHub Release
    needs: [ build-android, build-windows ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
