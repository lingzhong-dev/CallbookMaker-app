name: Build Android & Windows Installers

on:
  push:
    branches: [ main, master, beta ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-version:
    name: Resolve & Auto-Increment Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semver.outputs.version }}
      build_number: ${{ steps.semver.outputs.build_number }}
      tag_name: ${{ steps.semver.outputs.tag_name }}
      app_version: ${{ steps.semver.outputs.app_version }}
      prerelease: ${{ steps.semver.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next semantic version
        id: semver
        run: |
          git fetch --prune --prune-tags --tags --force
          PUB_LINE=$(grep '^version:' pubspec.yaml | head -n 1 | awk '{print $2}')
          PUB_VER=$(echo "$PUB_LINE" | cut -d'+' -f1)
          PUB_BUILD=$(echo "$PUB_LINE" | cut -s -d'+' -f2)
          PUB_VER=${PUB_VER:-1.0.0}
          PUB_BUILD=${PUB_BUILD:-100}

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG_NAME#v}"
            APP_VERSION="$VERSION"
            PRERELEASE="false"
            if [[ "$TAG_NAME" == *-* ]]; then
              PRERELEASE="true"
            fi
            MAIN_TAG_COUNT=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | wc -l | tr -d ' ')
            BUILD_NUM=$(( PUB_BUILD + MAIN_TAG_COUNT ))
          elif [[ "$GITHUB_REF" == "refs/heads/beta" ]]; then
            LATEST_BETA=$(git tag -l 'beta-v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
            if [ -z "$LATEST_BETA" ]; then
              VERSION="$PUB_VER"
            else
              BASE_VER="${LATEST_BETA#beta-v}"
              MAJOR=$(echo "$BASE_VER" | cut -d'.' -f1)
              MINOR=$(echo "$BASE_VER" | cut -d'.' -f2)
              PATCH=$(echo "$BASE_VER" | cut -d'.' -f3)
              NEXT_PATCH=$(( PATCH + 1 ))
              while git rev-parse "refs/tags/beta-v${MAJOR}.${MINOR}.${NEXT_PATCH}" >/dev/null 2>&1; do
                NEXT_PATCH=$(( NEXT_PATCH + 1 ))
              done
              VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}"
            fi
            TAG_NAME="beta-v${VERSION}"
            APP_VERSION="beta-${VERSION}"
            PRERELEASE="true"
            TOTAL_TAG_COUNT=$(git tag -l | wc -l | tr -d ' ')
            BUILD_NUM=$(( PUB_BUILD > TOTAL_TAG_COUNT ? PUB_BUILD + TOTAL_TAG_COUNT : TOTAL_TAG_COUNT + 1 ))
          else
            LATEST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
            MAIN_TAG_COUNT=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | wc -l | tr -d ' ')
            if [ -z "$LATEST_TAG" ]; then
              VERSION="$PUB_VER"
              BUILD_NUM="$PUB_BUILD"
            elif ! git rev-parse "refs/tags/v${PUB_VER}" >/dev/null 2>&1; then
              VERSION="$PUB_VER"
              BUILD_NUM=$(( PUB_BUILD + MAIN_TAG_COUNT ))
            else
              BASE_VER="${LATEST_TAG#v}"
              MAJOR=$(echo "$BASE_VER" | cut -d'.' -f1)
              MINOR=$(echo "$BASE_VER" | cut -d'.' -f2)
              PATCH=$(echo "$BASE_VER" | cut -d'.' -f3)
              NEXT_PATCH=$(( PATCH + 1 ))
              while git rev-parse "refs/tags/v${MAJOR}.${MINOR}.${NEXT_PATCH}" >/dev/null 2>&1; do
                NEXT_PATCH=$(( NEXT_PATCH + 1 ))
              done
              VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}"
              BUILD_NUM=$(( PUB_BUILD + MAIN_TAG_COUNT ))
            fi
            TAG_NAME="v${VERSION}"
            APP_VERSION="$VERSION"
            PRERELEASE="false"
          fi

          echo "Resolved version=${VERSION}, build_number=${BUILD_NUM}, tag_name=${TAG_NAME}, app_version=${APP_VERSION}, prerelease=${PRERELEASE}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_number=${BUILD_NUM}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"

  build-android:
    name: Build Android APK
    needs: [ prepare-version ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Accept Android SDK licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - run: flutter pub get

      - name: Build universal APK
        run: |
          flutter build apk --release --build-name="${{ needs.prepare-version.outputs.version }}" --build-number="${{ needs.prepare-version.outputs.build_number }}" --dart-define=APP_VERSION="${{ needs.prepare-version.outputs.app_version }}"
          mkdir -p dist/android
          cp build/app/outputs/flutter-apk/app-release.apk "dist/android/CallbookMaker-${{ needs.prepare-version.outputs.tag_name }}-android-universal.apk"

      - name: Build arm64-v8a split APK
        run: |
          flutter build apk --release --split-per-abi --build-name="${{ needs.prepare-version.outputs.version }}" --build-number="${{ needs.prepare-version.outputs.build_number }}" --dart-define=APP_VERSION="${{ needs.prepare-version.outputs.app_version }}"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/android/CallbookMaker-${{ needs.prepare-version.outputs.tag_name }}-android-arm64-v8a.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: CallbookMaker-Android-APK
          path: dist/android/*.apk

  build-windows:
    name: Build Windows Setup & Portable
    needs: [ prepare-version ]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Sync Windows Runner.rc version
        shell: pwsh
        run: |
          $ver = "${{ needs.prepare-version.outputs.version }}"
          $build = "${{ needs.prepare-version.outputs.build_number }}"
          $parts = $ver.Split('.')
          $commaVer = "$($parts[0]),$($parts[1]),$($parts[2]),$build"
          $dotVer = "$ver.$build"
          $rcPath = "windows\runner\Runner.rc"
          if (Test-Path $rcPath) {
            $rc = Get-Content $rcPath -Raw
            $rc = $rc -replace 'FILEVERSION\s+\d+,\d+,\d+,\d+', "FILEVERSION $commaVer"
            $rc = $rc -replace 'PRODUCTVERSION\s+\d+,\d+,\d+,\d+', "PRODUCTVERSION $commaVer"
            $rc = $rc -replace '"FileVersion",\s*"[^"]+"', "`"FileVersion`", `"$dotVer`""
            $rc = $rc -replace '"ProductVersion",\s*"[^"]+"', "`"ProductVersion`", `"$dotVer`""
            Set-Content -Path $rcPath -Value $rc -Encoding utf8
          }

      - run: flutter pub get
      - run: flutter build windows --release --build-name="${{ needs.prepare-version.outputs.version }}" --build-number="${{ needs.prepare-version.outputs.build_number }}" --dart-define=APP_VERSION="${{ needs.prepare-version.outputs.app_version }}"

      - name: Package Portable ZIP and Setup EXE
        shell: pwsh
        run: |
          $ver = "${{ needs.prepare-version.outputs.version }}"
          $tagName = "${{ needs.prepare-version.outputs.tag_name }}"
          $releaseDir = @('build\windows\x64\runner\Release', 'build\windows\runner\Release') |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1
          if (-not $releaseDir) { throw 'Windows release build output directory not found' }
          $releaseAbs = (Resolve-Path $releaseDir).Path
          New-Item -ItemType Directory -Force -Path 'dist\windows' | Out-Null
          Compress-Archive -Path "$releaseAbs\*" -DestinationPath "dist\windows\CallbookMaker-$tagName-windows-x64-portable.zip" -Force

          $isccCandidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw 'Inno Setup ISCC.exe not found' }
          & $iscc "/DMyAppVersion=$ver" "/DMyAppVersionTag=$tagName" "/DReleaseDir=$releaseAbs" "windows\installer\CallbookMaker.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: CallbookMaker-Windows-Installer
          path: |
            dist/windows/*.exe
            dist/windows/*.zip

  release:
    name: Publish GitHub Release
    needs: [ prepare-version, build-android, build-windows ]
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/beta' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-version.outputs.tag_name }}
          name: ${{ needs.prepare-version.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.prepare-version.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.prepare-version.outputs.prerelease == 'true' && 'false' || 'true' }}
          files: release-assets/*
          generate_release_notes: true
