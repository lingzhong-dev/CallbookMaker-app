name: Flutter Analyze & Test

on:
  push:
    branches: [ main, master, beta ]
  pull_request:
    branches: [ main, master, beta ]

jobs:
  verify:
    name: Flutter Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test -r expanded
