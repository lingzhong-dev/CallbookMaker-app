name: live_call_studio
description: CallbookMaker (Prism UI x Material 3) for Desktop (Windows/macOS/Linux) and Android.
publish_to: none
version: 1.0.2+3

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  prism_ui:
    path: packages/prism_ui
  audioplayers: ^6.1.0
  crypto: ^3.0.6
  file_picker: ^10.3.3
  http: ^1.3.0
  path_provider: ^2.1.5
  pointycastle: ^4.0.0
  share_plus: ^10.1.4
  shared_preferences: ^2.5.2
  window_manager: ^0.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#1A1A1A"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  adaptive_icon_foreground_inset: 0
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256

flutter:
  uses-material-design: true
  assets:
    - assets/images/icon.png
    - assets/images/icon.ico
    - assets/images/services/
  fonts:
    - family: GoogleSans
      fonts:
        - asset: assets/fonts/GoogleSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/GoogleSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/GoogleSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/GoogleSans-Bold.ttf
          weight: 700
    - family: Twemoji
      fonts:
        - asset: assets/fonts/Twemoji.Mozilla.ttf
